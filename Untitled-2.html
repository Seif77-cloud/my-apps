<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VESTRA - Wear Your Vibe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0f0f0f;color:#fff}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px 5%;background:rgba(15,15,15,.9);backdrop-filter:blur(10px);z-index:100}
.logo{font-size:28px;font-weight:900;letter-spacing:4px}
.logo span{color:#ff3d68}
nav a{color:#fff;text-decoration:none;margin:0 15px;font-weight:600}
.cart-btn{background:#ff3d68;border:none;color:#fff;padding:10px 18px;border-radius:30px;font-weight:700;cursor:pointer}
.hero{min-height:95vh;display:flex;align-items:center;padding:120px 5% 50px;background:linear-gradient(90deg,#0f0f0f 50%,transparent),url('https://images.unsplash.com/photo-1445205170230-053b83016050?q=80&w=1200&auto=format&fit=crop') center/cover}
.hero h1{font-size:64px;line-height:1.1;max-width:600px}
.hero h1 i{color:#ff3d68;font-style:normal}
.hero p{margin:20px 0;color:#ccc;font-size:18px;max-width:500px}
.hero-buttons button{padding:14px 28px;border-radius:30px;border:none;font-weight:800;cursor:pointer;margin-right:12px;font-size:16px}
.btn-men{background:#fff;color:#000}
.btn-women{background:#ff3d68;color:#fff}
.filter{display:flex;justify-content:center;gap:15px;padding:40px 5% 10px}
.filter button{padding:12px 30px;border-radius:30px;border:1px solid #333;background:#1a1a1a;color:#fff;cursor:pointer;font-weight:700}
.filter button.active{background:#ff3d68;border-color:#ff3d68}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:25px;padding:30px 5% 80px}
.card{background:#1a1a1a;border-radius:20px;overflow:hidden;transition:.3s}
.card:hover{transform:translateY(-8px)}
.card .img-box{width:100%;aspect-ratio:3/4;overflow:hidden;background:#222}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card-info{padding:16px}
.card-info h3{font-size:18px}
.card-info p{color:#aaa;font-size:13px;margin:6px 0}
.price{font-size:20px;font-weight:800;color:#ff3d68}
.add{width:100%;margin-top:12px;padding:12px;border:none;border-radius:12px;background:#fff;font-weight:800;cursor:pointer}
.add:hover{background:#ff3d68;color:#fff}
.cart-drawer{position:fixed;top:0;right:-400px;width:380px;max-width:90%;height:100%;background:#fff;color:#000;padding:25px;transition:.4s;z-index:200;overflow-y:auto}
.cart-drawer.open{right:0}
.cart-item{display:flex;gap:12px;margin:15px 0;align-items:center}
.cart-item img{width:60px;height:75px;object-fit:cover;border-radius:10px}
.checkout{width:100%;padding:15px;background:#25D366;border:none;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;margin-top:15px}
footer{text-align:center;padding:30px;color:#888}
@media(max-width:600px){.hero h1{font-size:42px} nav{display:none}}
</style>
</head>
<body>

<header>
<div class="logo">VEST<span>RA</span></div>
<nav><a href="#">Home</a><a href="#shop">Shop</a><a href="#shop">Men</a><a href="#shop">Women</a></nav>
<button class="cart-btn" onclick="toggleCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<section class="hero">
<div>
<p style="color:#ff3d68;font-weight:800;letter-spacing:3px">NEW COLLECTION 2026</p>
<h1>WEAR YOUR <i>VIBE.</i><br>NOT JUST CLOTHES.</h1>
<p>ستايل مختلف، خامة نضيفة، وسعر على قد الإيد. اختار ستايلك واطلب واتساب في ثانية.</p>
<div class="hero-buttons">
<button class="btn-men" onclick="filterProducts('men')">SHOP MEN →</button>
<button class="btn-women" onclick="filterProducts('women')">SHOP WOMEN →</button>
</div>
</div>
</section>

<div class="filter" id="shop">
<button onclick="filterProducts('all')" id="btn-all" class="active">ALL</button>
<button onclick="filterProducts('men')" id="btn-men">MEN</button>
<button onclick="filterProducts('women')" id="btn-women">WOMEN</button>
</div>

<section class="products" id="products"></section>

<div class="cart-drawer" id="cartDrawer">
<h2>Your Cart 🛒</h2>
<div id="cartItems"><p style="color:#888;margin-top:20px">السلة فاضية لسه...</p></div>
<h3 style="margin-top:20px">Total: <span id="total">0</span> EGP</h3>
<button class="checkout" onclick="checkout()">اطلب واتساب 📱</button>
<button onclick="toggleCart()" style="width:100%;margin-top:10px;padding:10px;border:none;background:#eee;border-radius:10px;cursor:pointer">Close</button>
</div>

<footer>VESTRA © 2026 | 📞 01205014931 | Made by Seif</footer>

<script>
const products=[
{id:1,name:"Oversized Black Hoodie",cat:"men",price:850,img:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?q=80&w=600&auto=format&fit=crop"},
{id:2,name:"Classic White T-Shirt",cat:"men",price:450,img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=600&auto=format&fit=crop"},
{id:3,name:"Denim Jacket",cat:"men",price:1200,img:"https://images.unsplash.com/photo-1551028719-00167b16eac5?q=80&w=600&auto=format&fit=crop"},
{id:4,name:"Cargo Pants Beige",cat:"men",price:950,img:"https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?q=80&w=600&auto=format&fit=crop"},
{id:5,name:"Elegant Pink Dress",cat:"women",price:1100,img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?q=80&w=600&auto=format&fit=crop"},
{id:6,name:"White Crop Top",cat:"women",price:500,img:"https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=600&auto=format&fit=crop"},
{id:7,name:"Floral Summer Dress",cat:"women",price:980,img:"https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=600&auto=format&fit=crop"},
{id:8,name:"Chic Blazer Women",cat:"women",price:1350,img:"https://images.unsplash.com/photo-1539533018447-63fcce2678e3?q=80&w=600&auto=format&fit=crop"},
];
let cart=[];
function render(filter='all'){
let list=products.filter(p=>filter==='all'||p.cat===filter);
document.getElementById('products').innerHTML=list.map(p=>`
<div class="card">
<div class="img-box"><img src="${p.img}" loading="lazy"></div>
<div class="card-info"><h3>${p.name}</h3><p>${p.cat==='men'?'Men':'Women'} • VESTRA Original</p><div class="price">${p.price} EGP</div><button class="add" onclick="addToCart(${p.id})">Add To Cart +</button></div>
</div>`).join('');
document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active'));
if(filter==='all') document.getElementById('btn-all').classList.add('active');
if(filter==='men') document.getElementById('btn-men').classList.add('active');
if(filter==='women') document.getElementById('btn-women').classList.add('active');
}
function filterProducts(f){render(f);document.getElementById('shop').scrollIntoView({behavior:'smooth'})}
function addToCart(id){cart.push(products.find(p=>p.id===id));updateCart();toggleCart(true)}
function updateCart(){
document.getElementById('count').innerText=cart.length;
let total=cart.reduce((s,p)=>s+p.price,0);
document.getElementById('total').innerText=total;
document.getElementById('cartItems').innerHTML=cart.length?cart.map((p,i)=>`<div class="cart-item"><img src="${p.img}"><div><b>${p.name}</b><br>${p.price} EGP</div><button onclick="removeItem(${i})" style="margin-left:auto;border:none;background:none;cursor:pointer;font-size:18px">✕</button></div>`).join(''):'<p style="color:#888;margin-top:20px">السلة فاضية لسه...</p>';
}
function removeItem(i){cart.splice(i,1);updateCart()}
function toggleCart(open){
let d=document.getElementById('cartDrawer');
if(open) d.classList.add('open'); else d.classList.toggle('open');
}
function checkout(){
if(!cart.length){alert('السلة فاضية!');return}
let msg='Hello VESTRA! I want to order:\n'+cart.map(p=>`- ${p.name} : ${p.price} EGP`).join('\n')+`\nTotal: ${cart.reduce((s,p)=>s+p.price,0)} EGP`;
window.open('https://wa.me/201205014931?text='+encodeURIComponent(msg),'_blank');
}
render();
</script>
</body>
</html>
